# Single entry point for everything that runs in this repo (see CLAUDE.md).
version: "3"

vars:
  # Every workspace package, straight from the filesystem.
  PKGS:
    sh: ls -d packages/*

tasks:
  install:
    desc: Install all workspace dependencies and the test browser
    cmds:
      - bun install
      - bunx playwright install chromium

  build:
    desc: Build every package (ESM, IIFE for core, .d.ts, publint + attw checks)
    cmds:
      - for: { var: PKGS }
        cmd: cd {{.ITEM}} && bunx tsdown

  typecheck:
    desc: Type-check every package and the repo tooling with tsc, the docs site with astro check, and the API reference with TypeDoc (a type the public API refers to but never exports fails here)
    cmds:
      - bunx tsc -p tsconfig.json
      - for: { var: PKGS }
        cmd: bunx tsc -p {{.ITEM}}/tsconfig.json
      - cd apps/docs && bunx astro check
      - cd apps/docs && bunx typedoc --emit none

  lint:
    desc: Lint and format-check with Biome
    cmds:
      - bunx biome check .

  format:
    desc: Apply Biome formatting and safe fixes
    cmds:
      - bunx biome check --write .

  test:
    desc: Run the browser test suites once
    cmds:
      - bunx vitest run

  test:watch:
    desc: Run the browser test suites in watch mode
    cmds:
      - bunx vitest

  check:
    desc: Everything CI runs. Run before reporting work as done.
    cmds:
      - task: lint
      - task: docs:readme
        vars: { CLI_ARGS: --check }
      - task: typecheck
      - task: build
      - task: docs:build
      - task: test

  # Dev servers: one dir-scoped task per app plus a bare picker, so a second app is a pure
  # addition (adpharm-stack, `per-app-picker`). The docs site is the only app, and the demo.
  start:docs:
    aliases: [dev:docs]
    desc: Serve the docs site and demo with live reload; the API reference regenerates on package source changes
    dir: apps/docs
    interactive: true
    cmds:
      - bunx astro dev

  start:
    aliases: [dev]
    desc: Start an app's dev server (interactive app picker)
    interactive: true
    silent: true
    cmds:
      - |
        echo "Start which app?"
        select app in docs quit; do
          case "$app" in
            docs) exec task start:docs ;;
            quit) break ;;
            *) echo "invalid" ;;
          esac
        done

  docs:build:
    desc: Build the docs site (generates the API reference from packages/*/src into apps/docs/dist)
    dir: apps/docs
    cmds:
      - bunx astro build

  docs:preview:
    desc: Serve the built docs site
    dir: apps/docs
    interactive: true
    cmds:
      - bunx astro preview

  docs:readme:
    desc: "Embed the docs examples into package READMEs (task docs:readme -- --check only verifies)"
    cmds:
      - bun scripts/embed-examples.ts {{.CLI_ARGS}}

  changeset:
    desc: Record a changeset for the packages you touched
    cmds:
      - bunx changeset

  version:
    desc: Apply pending changesets to versions and changelogs (the release workflow runs this)
    cmds:
      - bunx changeset version
      - bun install

  release:
    desc: Publish unpublished versions, tag them, create GitHub releases (the release workflow runs this)
    cmds:
      - bun scripts/release.ts

  clean:
    desc: Remove build output
    cmds:
      - rm -rf packages/*/dist apps/docs/dist apps/docs/.astro apps/docs/src/content/docs/api
