name: Release

# Every push to main that carries changesets becomes a release, with no human step:
# check → bump versions and changelogs → commit them back → publish with provenance → tag → GitHub release.
# A push to main without changesets runs the check and stops at "nothing to publish".
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC); no npm token is stored anywhere

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm >= 11.5.1 is required for Trusted Publishing
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Nothing red ships
        run: task check
      - name: Apply changesets and commit the versions back
        env:
          GITHUB_TOKEN: ${{ github.token }} # the changelog links each entry to its commit and PR
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            task version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "release: version packages"
            git push
          else
            echo "no changesets: nothing to version"
          fi
      - name: Publish, tag, and create GitHub releases (each only if not done yet)
        run: task release
        env:
          GH_TOKEN: ${{ github.token }}
