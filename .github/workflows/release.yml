name: Release

# Every push to main that carries changesets becomes a release, with no human step:
# check → bump versions and changelogs → commit them back → publish with provenance → tag → GitHub release.
# Publish, tag and release are each skipped when already done (see scripts/release.ts), so a push
# without changesets only checks, and a rerun finishes whatever an earlier run left undone.
#
# main is protected (see .github/rulesets/main.json): only a bypass actor can push to it, and the
# default GITHUB_TOKEN can never be one. The version commit is pushed with a token minted for the
# release GitHub App, which is on the bypass list. Set it up once: create the App with Contents
# read/write, install it on this repo, then store its Client ID as the RELEASE_APP_CLIENT_ID
# repository variable and its private key as the RELEASE_APP_PRIVATE_KEY secret.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC); no npm token is stored anywhere

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: release-app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }} # git push below goes out as the App
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # npm >= 11.5.1 is required for Trusted Publishing
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Nothing red ships
        run: task check
      - name: Apply changesets and commit the versions back
        env:
          GITHUB_TOKEN: ${{ github.token }} # the changelog links each entry to its commit and PR
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            task version
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            # Unlike GITHUB_TOKEN, an App token's push triggers workflows; this run already checked
            # and is about to publish, so the version commit itself does not need another run.
            git commit -m "release: version packages [skip ci]"
            git push
          else
            echo "no changesets: nothing to version"
          fi
      - name: Publish, tag, and create GitHub releases (each only if not done yet)
        run: task release
        env:
          GH_TOKEN: ${{ github.token }}
